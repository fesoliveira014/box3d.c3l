name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  C3C_VERSION: v0.8.3

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The static tarball, not the stock release build: the stock one needs a newer glibc than
      # this package's baseline, and a release must build on the oldest host it claims to support.
      - name: Install c3c ${{ env.C3C_VERSION }}
        run: |
          curl -fsSL -o c3c.tar.gz \
            "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-linux-static.tar.gz"
          mkdir -p "$HOME/opt" && tar -xzf c3c.tar.gz -C "$HOME/opt"
          echo "$(dirname "$(find "$HOME/opt" -name c3c -type f -perm -u+x | head -1)")" >> "$GITHUB_PATH"

      - name: Report c3c version
        run: c3c --version

      # Builds libbox3d.a and fails if any probed struct layout drifted from the $assert pins.
      - name: Build box3d and check the layout pins
        run: ./scripts/build-box3d.sh --check

      - name: Compile the package
        run: |
          c3c compile-only --no-obj src/*.c3i src/*.c3
          rm -rf obj

      - name: Build and run the test project
        working-directory: test
        run: |
          c3c build smoke
          c3c test unit
          c3c test unit-checked

      - name: Comment audit
        run: ./scripts/audit-comments.sh --gate

      - name: Assertion survey
        run: ./scripts/audit-assertions.sh

      - name: Package
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      # The artifact must build a consumer that has neither this repository nor CMake.
      - name: Consumer smoke test
        run: |
          mkdir -p /tmp/consumer/libs /tmp/consumer/src
          cp dist/b3.c3l /tmp/consumer/libs/b3.c3l
          cat > /tmp/consumer/project.json <<'JSON'
          {
            "langrev": "1",
            "dependency-search-paths": [ "libs" ],
            "dependencies": [ "b3" ],
            "sources": [ "src/**" ],
            "targets": { "consumer": { "type": "executable" } }
          }
          JSON
          cat > /tmp/consumer/src/main.c3 <<'C3'
          module consumer;
          import b3;

          fn int main() {
              b3::require_float_abi()!!;
              b3::WorldDef def = b3::default_world_def();
              b3::WorldId world = b3::create_world(&def)!!;
              defer world.destroy();
              world.step(1.0f / 60.0f, 4);
              draw::DebugDraw debug = draw::default_debug_draw();
              world.draw(&debug, ulong::max);
              record::Recording* recording = record::create_recording(4096);
              defer recording.destroy();
              return 0;
          }
          C3
          cd /tmp/consumer && c3c build consumer && ./out/consumer

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/b3.c3l dist/b3.c3l.sha256
