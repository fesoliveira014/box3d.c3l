name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  C3C_VERSION: v0.8.3

jobs:
  # box3d is built on each platform it ships for; there is no cross-compilation. This job's only
  # output is the archive, and the layout probe that proves it agrees with the pins the Linux job
  # will compile beside it.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build box3d and check the layout pins
        run: ./scripts/build-box3d.sh --check

      - uses: actions/upload-artifact@v4
        with:
          name: box3d-windows-x64
          path: linked-libs/windows-x64/box3d.lib
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The static tarball, not the stock release build: the stock one needs a newer glibc than
      # this package's baseline, and a release must build on the oldest host it claims to support.
      - name: Install c3c ${{ env.C3C_VERSION }}
        # Downloaded outside the checkout: an archive left in the repository root is an untracked
        # file, and the packaging step refuses a working tree that carries one.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3c.tar.gz" \
            "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-linux-static.tar.gz"
          mkdir -p "$RUNNER_TEMP/c3" && tar -xzf "$RUNNER_TEMP/c3c.tar.gz" -C "$RUNNER_TEMP/c3"
          echo "$(dirname "$(find "$RUNNER_TEMP/c3" -name c3c -type f -perm -u+x | head -1)")" >> "$GITHUB_PATH"

      - name: Report c3c version
        run: c3c --version

      # Builds libbox3d.a and fails if any probed struct layout drifted from the $assert pins.
      - name: Build box3d and check the layout pins
        run: ./scripts/build-box3d.sh --check

      # The archive the windows job built. Packaging refuses to ship without it, since the manifest
      # declares the target either way and a consumer would reach link before finding out.
      - uses: actions/download-artifact@v4
        with:
          name: box3d-windows-x64
          path: linked-libs/windows-x64

      - name: Compile the package
        run: |
          c3c compile-only --no-obj src/*.c3i src/*.c3
          rm -rf obj

      - name: Build and run the test project
        working-directory: test
        run: |
          c3c build smoke
          c3c test unit
          c3c test unit-checked

      - name: Comment audit
        run: ./scripts/audit-comments.sh --gate

      - name: Assertion survey
        run: ./scripts/audit-assertions.sh

      - name: Package
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      # The artifact must build a consumer that has neither this repository nor CMake.
      # The project is checked in at scripts/consumer-smoke so a sweep over the package sources
      # reaches it; it lived in a heredoc here and went stale when the API changed.
      - name: Consumer smoke test
        run: |
          cp -r scripts/consumer-smoke "$RUNNER_TEMP/consumer"
          mkdir -p "$RUNNER_TEMP/consumer/libs"
          cp dist/b3.c3l "$RUNNER_TEMP/consumer/libs/b3.c3l"
          cd "$RUNNER_TEMP/consumer" && c3c build consumer && ./out/consumer

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/b3.c3l dist/b3.c3l.sha256
